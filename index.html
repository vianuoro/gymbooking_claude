<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NW Booking Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #131313;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --accent: #c8ff00;
    --accent-dim: rgba(200,255,0,0.12);
    --red: #ff4444;
    --text: #e8e8e8;
    --muted: #666;
    --success: #00ff88;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(200,255,0,0.3);
    line-height: 1;
  }

  .logo span { color: var(--text); }

  .tagline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 20px;
  }

  .card-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 3px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover:not(:disabled) { 
    background: #d9ff1a;
    box-shadow: 0 0 20px rgba(200,255,0,0.3);
  }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    margin-top: 12px;
  }
  .btn-danger:hover:not(:disabled) { background: rgba(255,68,68,0.1); }

  /* Classes list */
  #classes-section { display: none; }

  .classes-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .class-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
  }

  .class-item:hover { border-color: #444; background: #0f0f0f; }

  .class-item.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .class-name {
    font-weight: 500;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .class-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .class-spots {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 2px;
    background: var(--surface2);
    color: var(--muted);
    white-space: nowrap;
  }

  .class-spots.open { color: var(--success); background: rgba(0,255,136,0.08); }

  /* Status panel */
  #status-section { display: none; }

  .status-panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 20px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .status-row:last-child { border-bottom: none; }

  .status-key { color: var(--muted); }
  .status-val { color: var(--accent); font-weight: 500; }
  .status-val.success { color: var(--success); }
  .status-val.error { color: var(--red); }

  /* Counter */
  #attempt-counter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--accent);
    text-align: center;
    letter-spacing: 4px;
    line-height: 1;
    padding: 12px 0;
    text-shadow: 0 0 30px rgba(200,255,0,0.2);
  }

  /* Pulse dot */
  .pulse-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .msg {
    font-family: var(--mono);
    font-size: 11px;
    padding: 10px 14px;
    border-radius: 3px;
    margin-top: 12px;
  }
  .msg.error { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: var(--red); }
  .msg.info { background: rgba(200,255,0,0.06); border: 1px solid rgba(200,255,0,0.2); color: var(--accent); }
  .msg.success { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.3); color: var(--success); }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success flash */
  @keyframes successFlash {
    0% { background: var(--surface); }
    20% { background: rgba(0,255,136,0.15); }
    100% { background: var(--surface); }
  }
  .success-flash { animation: successFlash 1.5s ease; }
</style>
</head>
<body>

<header>
  <div class="logo">NW<span>.</span>BOT</div>
  <div class="tagline">Nordic Wellness · Booking Automator</div>
</header>

<!-- Step 1: Credentials -->
<div class="card" id="credentials-card">
  <div class="card-title">01 · Credentials</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
  </div>

  <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Fetch Classes</button>
  <div id="login-msg"></div>
</div>

<!-- Step 2: Class selection -->
<div class="card" id="classes-section">
  <div class="card-title">02 · Select Class</div>
  <div class="classes-grid" id="classes-list"></div>
  <div id="select-msg"></div>
  <button class="btn btn-primary" id="book-btn" onclick="startBooking()" disabled style="margin-top:20px">
    Start Hammering
  </button>
</div>

<!-- Step 3: Live status -->
<div class="card" id="status-section">
  <div class="card-title">03 · Status</div>

  <div id="attempt-counter">0</div>

  <div class="status-panel">
    <div class="status-row">
      <span class="status-key">STATE</span>
      <span class="status-val" id="s-status">–</span>
    </div>
    <div class="status-row">
      <span class="status-key">LAST RESPONSE</span>
      <span class="status-val" id="s-response" style="max-width:60%;text-align:right;word-break:break-all">–</span>
    </div>
  </div>

  <div id="status-msg"></div>
  <button class="btn btn-danger" id="stop-btn" onclick="stopBooking()">Stop</button>
</div>

<script>
  let selectedClass = null;   // full class object (activityId, csrf1, csrf2, formAction…)
  let pollInterval  = null;
  let allClasses    = [];

  // ── Login & fetch classes ────────────────────────────────────────────────

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg = document.getElementById('login-msg');
    const btn = document.getElementById('login-btn');

    if (!email || !password) {
      showMsg(msg, 'Enter email and password.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Logging in & fetching classes…';
    msg.innerHTML = '';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Login failed');

      allClasses = data.classes;
      renderClasses(allClasses);
      document.getElementById('classes-section').style.display = 'block';
      document.getElementById('classes-section').scrollIntoView({ behavior: 'smooth' });
      showMsg(msg, `✓ Logged in. Found ${allClasses.length} class(es).`, 'info');
    } catch (e) {
      showMsg(msg, e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch Classes';
    }
  }

  function renderClasses(classes) {
    const list = document.getElementById('classes-list');
    if (!classes.length) {
      list.innerHTML = '<div class="empty-state">No classes found.<br/>Try again — the page may still be loading.</div>';
      return;
    }

    // Group by date
    const byDate = {};
    classes.forEach(c => {
      const d = c.date || 'Unknown date';
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(c);
    });

    list.innerHTML = Object.entries(byDate).map(([date, items]) => `
      <div style="margin-bottom:6px">
        <div style="font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;padding:6px 0 8px">
          📅 ${date}
        </div>
        ${items.map(c => `
          <div class="class-item" data-activity-id="${escHtml(c.activityId)}"
               onclick="selectClass(this, '${escHtml(c.activityId)}')">
            <div>
              <div class="class-name">${escHtml(c.name)}</div>
              <div class="class-meta">
                ${c.time    ? `<span>⏰ ${escHtml(c.time)}</span>`    : ''}
                ${c.gym     ? `<span>📍 ${escHtml(c.gym)}</span>`     : ''}
                ${c.trainer ? `<span>👤 ${escHtml(c.trainer)}</span>` : ''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  function selectClass(el, activityId) {
    document.querySelectorAll('.class-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    selectedClass = allClasses.find(c => c.activityId === activityId) || null;
    document.getElementById('book-btn').disabled = !selectedClass;
    document.getElementById('select-msg').innerHTML = '';
  }

  // ── Start booking ────────────────────────────────────────────────────────

  async function startBooking() {
    if (!selectedClass) return;
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    const res = await fetch('/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        password,
        activityId:  selectedClass.activityId,
        csrf1:       selectedClass.csrf1,
        csrf2:       selectedClass.csrf2,
        formAction:  selectedClass.formAction,
      })
    });
    const data = await res.json();
    if (!data.ok) { alert(data.error); return; }

    document.getElementById('status-section').style.display = 'block';
    document.getElementById('status-section').scrollIntoView({ behavior: 'smooth' });
    pollInterval = setInterval(pollStatus, 300);
  }

  async function pollStatus() {
    try {
      const res = await fetch('/status');
      const d = await res.json();
      document.getElementById('attempt-counter').textContent = d.attempts.toLocaleString();

      const sStatus = document.getElementById('s-status');
      const sResponse = document.getElementById('s-response');

      sStatus.textContent = d.status.toUpperCase();
      sStatus.className = 'status-val' + (d.success ? ' success' : d.status === 'stopped' ? ' error' : '');
      sResponse.textContent = d.last_response || '–';

      const statusMsg = document.getElementById('status-msg');

      if (d.success) {
        clearInterval(pollInterval);
        showMsg(statusMsg, '🎉 CLASS BOOKED SUCCESSFULLY!', 'success');
        document.getElementById('status-section').classList.add('success-flash');
        document.getElementById('stop-btn').disabled = true;
        addPulseDot(false);
      } else if (d.status === 'stopped') {
        clearInterval(pollInterval);
        showMsg(statusMsg, 'Stopped after ' + d.attempts.toLocaleString() + ' attempts.', 'info');
        addPulseDot(false);
      } else {
        addPulseDot(true);
      }
    } catch (e) { /* ignore */ }
  }

  async function stopBooking() {
    await fetch('/stop', { method: 'POST' });
    clearInterval(pollInterval);
  }

  // ── Helpers ──────────────────────────────────────────────────────────────

  function showMsg(el, text, type) {
    el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addPulseDot(active) {
    const title = document.querySelector('#status-section .card-title');
    const existing = title.querySelector('.pulse-dot');
    if (active && !existing) {
      const dot = document.createElement('span');
      dot.className = 'pulse-dot';
      title.prepend(dot);
    } else if (!active && existing) {
      existing.remove();
    }
  }

  // Allow Enter key on password field
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
